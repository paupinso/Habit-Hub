# Netlify Production Configuration for HabitPulse (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback rule: routes all URLs to index.html with HTTP status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers for smooth performance and correct MIME types
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
